<script>document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('pre').forEach(function(pre){if(pre.dataset.copyReady)return;pre.dataset.copyReady='1';var text=(pre.querySelector('code')||pre).innerText;pre.style.position='relative';var b=document.createElement('button');b.type='button';b.textContent='복사';b.setAttribute('aria-label','코드 복사');b.style.cssText='position:absolute;top:12px;right:12px;padding:6px 12px;font-size:12px;font-weight:700;color:#0066CC;background:#fff;border:1px solid #cfcdc6;border-radius:6px;cursor:pointer;line-height:1;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.08)';b.addEventListener('click',function(){var done=function(){b.textContent='복사됨';b.style.color='#fff';b.style.background='#0066CC';setTimeout(function(){b.textContent='복사';b.style.color='#0066CC';b.style.background='#fff';},1500);};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done);}else{var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);done();}});pre.appendChild(b);});});</script>

<script>
/* 맥부킷 — 코드블록에서만 선택·복사를 되살린다.
   우클릭 금지 플러그인이 document 에 selectstart·contextmenu 를 걸어 두는데,
   명령어 글에서 «복사»가 막히면 글의 쓸모가 사라진다.
   본문 전체를 푸는 대신 pre/code 안에서만 이벤트 전파를 끊는다. */
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('pre, pre code').forEach(function (el) {
    el.style.userSelect = 'text';
    el.style.webkitUserSelect = 'text';
    ['selectstart', 'contextmenu', 'dragstart', 'copy'].forEach(function (ev) {
      el.addEventListener(ev, function (e) { e.stopPropagation(); }, true);
    });
  });
});
</script>
